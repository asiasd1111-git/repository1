[project]
name = "pythonproject1"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.4.1,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "mypy (>=2.4.0,<3.0.0)"
]

[tool.poetry]
name = "bank-widget"
version = "0.1.0"
description = "Виджет последних успешных банковских операций"
authors = ["Ваше Имя <you@example.com>"]
packages = [{ include = "src" }]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
